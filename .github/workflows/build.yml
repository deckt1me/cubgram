name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/share/chromium
          sudo docker image prune --all --force || true
          df -h /
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: NDK
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
      - name: keystore
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] || { echo "нет секретов KS_B64 / KS_PASS"; exit 1; }
          mkdir -p TMessagesProj/config
          echo "$KS_B64" | base64 -d > TMessagesProj/config/release.keystore
          sed -i '/^RELEASE_/d' gradle.properties
          printf 'RELEASE_KEY_ALIAS=cubgram\nRELEASE_KEY_PASSWORD=%s\nRELEASE_STORE_PASSWORD=%s\n' "$KS_PASS" "$KS_PASS" >> gradle.properties
      - name: build
        run: |
          chmod +x gradlew
          ALL=$(./gradlew -q :TMessagesProj_App:tasks --all --no-daemon 2>/dev/null | grep -oE '^assemble[A-Za-z0-9_]*Release' | grep -v '^assembleRelease$')
          TASK=$(echo "$ALL" | grep -i afat | head -1)
          [ -z "$TASK" ] && TASK=$(echo "$ALL" | head -1)
          echo "TASK=$TASK"
          ./gradlew ":TMessagesProj_App:$TASK" --no-daemon -Dorg.gradle.parallel=false "-Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g"
      - name: verify signature
        run: |
          APK=$(find TMessagesProj_App/build/outputs/apk -name '*.apk' | head -1)
          AS=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$AS" verify --verbose --print-certs "$APK" | tee /tmp/v.txt
          grep -q "CN=CubGram, O=CubGram" /tmp/v.txt || { echo "APK подписан не нашим ключом"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: cubgram-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
